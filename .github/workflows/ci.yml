name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Package
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MinTransfer-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for f in release/*.dmg release/*-setup.exe; do
            [ -f "$f" ] || continue
            gh release upload "${GITHUB_REF_NAME}" "$f" --clobber || gh release create "${GITHUB_REF_NAME}" "$f" --title "MinTransfer ${GITHUB_REF_NAME#v}" --notes "See the README for installation notes."
          done
